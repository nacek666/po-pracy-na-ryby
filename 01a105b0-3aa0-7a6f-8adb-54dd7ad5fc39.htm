ny?\n   - zbieranie leadów (formularz kontaktowy / zapis na newsletter),\n   - sprzedaż konkretnego produktu/usługi,\n   - prezentacja portfolio lub oferty,\n   - zapis na wydarzenie / webinar,\n   - inny (jaki?).\n\n2. Do kogo jest kierowana strona (grupa docelowa)?\n   - wiek, branża, poziom wiedzy technicznej,\n   - kraj / język (czy strona tylko po polsku, czy wielojęzyczna?).\n\n3. W jednym–dwóch zdaniach: jak chcesz opisać swój produkt/usługę/projekt?\n\n4. Czy masz nazwę marki/firmy/produktu i slogan?\n   - nazwa:\n   - slogan/tagline (jeśli jest):\n\n---\n\n## 2. Struktura i sekcje strony\n\nZaznacz, które sekcje mają być na stronie, i opisz ich treść.\n\n1. Sekcja hero (górna, pierwszy ekran):\n   - główny nagłówek (H1),\n   - krótki opis (1–3 zdania),\n   - główne wezwanie do działania (CTA) – np. „Zapisz się”, „Skontaktuj się”, „Kup teraz”.\n\n2. Sekcja „O nas” / „O produkcie”:\n   - główna treść (co dokładnie chcesz przekazać, najlepiej gotowy tekst lub punkty),\n   - kluczowe korzyści lub cechy (wypunktuj 3–6).\n\n3. Sekcja funkcji/korzyści:\n   - lista funkcji/benefitów (każdy punkt: krótki nagłówek + 1–2 zdania opisu).\n\n4. Sekcja „Jak to działa” (jeśli potrzebna):\n   - 3–5 kroków procesu (każdy krok: tytuł + 1 zdanie opisu).\n\n5. Sekcja opinii / testimoniali (jeśli potrzebna):\n   - treść opinii, imię, rola/stanowisko, firma (lub informacja, że mają być przykładowe „placeholdery”).\n\n6. Sekcja cennika (jeśli potrzebna):\n   - nazwy planów,\n   - cena każdego planu,\n   - co zawiera każdy plan (lista punktów).\n\n7. Sekcja FAQ (często zadawane pytania) – jeśli chcesz:\n   - lista pytań i odpowiedzi.\n\n8. Sekcja kontakt / formularz:\n   - jakie pola formularza (np. imię, e-mail, telefon, wiadomość),\n   - czy formularz ma coś faktycznie wysyłać (realna integracja backend), czy ma być tylko front-endowy (bez realnego wysyłania; np. tylko walidacja i komunikat „wysłano”),\n   - dodatkowe dane kontaktowe: e-mail, telefon, adres, linki do social mediów.\n\n9. Stopka (footer):\n   - treść stopki (np. prawa autorskie, nazwa firmy, rok),\n   - linki: regulamin, polityka prywatności (czy mamy dodać tymczasowe odnośniki?).\n\nJeśli planujesz inne sekcje (np. blog, portfolio, galerię, licznik odliczający czas, sekcję z logotypami partnerów) – opisz je dokładnie.\n\n---\n\n## 3. Treści tekstowe i język\n\n1. W jakim języku ma być napisana cała strona (np. tylko PL, PL+EN, inny)?\n2. Czy posiadasz już gotowe teksty do poszczególnych sekcji?\n   - jeśli tak – wklej je lub opisz dokładnie (sekcja → tekst),\n   - jeśli nie – mam je dla Ciebie zaproponować na podstawie Twojego opisu?\n3. Ton komunikacji:\n   - oficjalny / półoficjalny / luźny,\n   - bardziej „marketingowo-sprzedażowy” czy bardziej informacyjny?\n4. Czy strona ma zawierać obowiązkowe elementy prawne (np. zgoda marketingowa przy formularzu, checkbox RODO, link do polityki prywatności)?\n   - jeśli tak – podaj, czego dokładnie wymagasz (np. treść zgody, linki, wymagalność checkboxa).\n\n---\n\n## 4. Identyfikacja wizualna i layout\n\n1. Kolory:\n   - czy masz konkretne kolory marki (np. w formacie HEX, #RRGGBB)?\n   - jeśli nie – opisz preferencje (np. „nowoczesny niebiesko-biały”, „ciemny, elegancki”, „pastelowy” itp.).\n\n2. Fonty:\n   - czy chcesz konkretne czcionki (np. Google Fonts: „Inter”, „Roboto”, „Lato”),\n   - lub: „prosty, czytelny font bezszeryfowy” itp.\n\n3. Styl graficzny:\n   - minimalistyczny / bogaty / ilustracje / zdjęcia stockowe / gradienty / „card layout” itp.,\n   - czy mają być duże zdjęcia w tle, czy raczej płaskie tła kolorystyczne?\n\n4. Układ:\n   - sekcyjny, „one page” przewijany w dół (typowy landing page),\n   - nawigacja górna typu „sticky” (przyklejony pasek menu),\n   - czy w menu mają być linki przewijające do sekcji (np. #o-nas, #kontakt).\n\n5. Logo:\n   - czy masz gotowe logo (w formie obrazka) – czy ma być tylko miejsce na nie (placeholder),\n   - czy mam użyć tekstowego „logo” (np. nazwa firmy stylizowana CSS-em)?\n\n---\n\n## 5. Elementy interaktywne (JavaScript)\n\nStrona ma korzystać z HTML, CSS i JavaScript. Potrzebuję, żebyś doprecyzował:\n\n1. Jakie elementy interaktywne chcesz:\n   - animowane przewijanie do sekcji,\n   - rozwijane FAQ (akordeon),\n   - slider opinii / galerii,\n   - licznik odliczający (countdown),\n   - modal/okno popup (np. po kliknięciu przycisku),\n   - walidacja formularza (sprawdzenie pól przed wysyłką),\n   - inne (jakie dokładnie?).\n\n2. Czy JavaScript ma być:\n   - napisany „czystym” JS (bez frameworków, np. bez React, Vue itp.),\n   - bez żadnych zewnętrznych bibliotek, czy dopuszczasz np. jedną lekką bibliotekę (powiedz jaką, jeśli masz preferencje)?\n\n3. Czy chcesz jakieś animacje / efekty:\n   - animacje wejścia sekcji przy przewijaniu,\n   - efekty hover na przyciskach/kartach,\n   - inne (opisz).\n\n---\n\n## 6. Responsywność i urządzenia\n\n1. Strona ma być w pełni responsywna (desktop, tablet, telefon)?\n2. Czy są jakieś konkretne wymagania co do layoutu na mobile (np. kolejność sekcji, inne treści, ukrywanie niektórych elementów)?\n\n---\n\n## 7. Wydajność, SEO i dostępność\n\n1. SEO:\n   - docelowe słowa kluczowe (po jakich frazach chcesz być znajdowany),\n   - tytuł strony (title),\n   - opis meta description (jeśli nie masz, mogę go wygenerować, ale potrzebuję Twojego opisu biznesu).\n\n2. Czy potrzebujesz:\n   - poprawnej struktury nagłówków (H1, H2, H3),\n   - tagów alt dla obrazków,\n   - przyjaznych nazw sekcji/id?\n\n3. Dostępność (a11y):\n   - czy są szczególne wymagania (np. wysoki kontrast, dostosowanie pod czytniki ekranowe, obsługa klawiaturą)?\n\n---\n\n## 8. Hosting i sposób publikacji\n\n1. Na jakim hostingu/serwerze lub platformie planujesz umieścić stronę?\n   - statyczny hosting (np. GitHub Pages, Netlify, Vercel, inny),\n   - własny serwer www (Apache/Nginx),\n   - inna opcja (jaka?).\n\n2. Czy potrzebujesz, żeby finalny kod był:\n   - w jednym pliku HTML z wbudowanym CSS/JS,\n   - czy osobne pliki: index.html, style.css, script.js?\n\n3. Czy mam dodać komentarze w kodzie (po polsku/angielsku) wyjaśniające strukturę i logikę?\n\n---\n\n## 9. Inne wymagania i ograniczenia\n\n1. Czy są jakieś linki referencyjne do stron, które Ci się podobają (design/rozmieszczenie treści)?\n   - podaj adresy URL i napisz, co dokładnie w nich Ci się podoba.\n\n2. Jakich technologii/koncepcji mam unikać?\n   - np. brak frameworków CSS (Bootstrap, Tailwind),\n   - brak zewnętrznych fontów,\n   - brak skryptów trackujących (Google Analytics itd.).\n\n3. Jaki ma być mniej więcej poziom „skomplikowania”:\n   - bardzo prosty / średnio zaawansowany / bardziej rozbudowany landing page?\n\n4. Czy strona powinna ładować się bardzo szybko kosztem ilości grafik/efektów?\n\n---\n\n## Co zrobię po Twoich odpowiedziach\n\n1. Na podstawie Twoich odpowiedzi przygotuję precyzyjny, gotowy do użycia prompt, np.:\n\n   - pełen opis projektu,\n   - wymagania techniczne (HTML, CSS, JS, podział na pliki),\n   - szczegółową strukturę sekcji i treści,\n   - wymagania odnośnie wyglądu i interakcji,\n   - wymagania SEO i dostępności.\n\n2. Prompt będzie tak napisany, żeby:\n   - nic nie było domyślane bez Twojej zgody,\n   - wszystkie niejasności były opisane jako: „jeśli X nie jest określone, użyj prostego placeholdera”.\n\n---\n\nProszę, odpowiedz punkt po punkcie (możesz numerować odpowiedzi jak w sekcjach, np. 1.1, 1.2 itd.). Gdy już będę miał komplet informacji albo wskażesz, czego na pewno nie chcesz doprecyzowywać, przygotuję dla Ciebie finalny, gotowy prompt."])</script><script>self.__next_f.push([1,"35:T1daa,"])</script><script>self.__next_f.push([1,"Poniżej masz wstępny zestaw pytań, który możemy zamienić na gotowy „prompt” do generatora strony (np. innego modelu AI). Najpierw zadam Ci wszystkie potrzebne pytania, a dopiero kiedy odpowiesz, ułożę finalny, dopracowany prompt po polsku lub po angielsku – jak wolisz.\n\nProszę, odpowiedz na poniższe punkty jak najbardziej konkretnie. Jeśli czegoś nie wiesz – napisz t otuj:\n   - finalny, kompletny projekt treści landing page,\n   - a następnie pełny kod front-end: `index.html`, `style.css`, `script.js` (lub w jednym pliku, jeśli użytkownik tak wybierze).\n4. Jeśli czegoś brakuje albo jest niejasne – dopytaj. Nie wymyślaj nic samodzielnie, chyba że użytkownik wyraźnie pozwoli na „placeholdery” lub autorskie propozycje.\n5. Używaj języka polskiego, chyba że użytkownik wyraźnie poprosi o angielski.\n\n---\n\n**Krok 1 – zadanie pytań użytkownikowi**\n\nNapisz do użytkownika:\n\n\u003e Poniżej masz wstępny zestaw pytań, który możemy zamienić na gotowy „prompt” do generatora strony (np. innego modelu AI). Najpierw zadam Ci wszystkie potrzebne pytania, a dopiero kiedy odpowiesz, ułożę finalny, dopracowany projekt i kod strony.  \n\u003e  \n\u003e Proszę, odpowiedz na poniższe punkty jak najbardziej konkretnie. Jeśli czegoś nie wiesz – napisz to wprost, wtedy dopytam. Możesz numerować odpowiedzi (np. 1.1, 1.2 itd.).\n\nNastępnie zadaj użytkownikowi poniższe pytania (możesz je pogrupować nagłówkami):\n\n---\n\n### 1. Cel i ogólny opis landing page\n\n1.1. Jaki jest główny cel strony?  \nMożesz wybrać jedną lub kilka opcji, albo doprecyzować własnymi słowami:\n- zbieranie leadów (formularz kontaktowy / zapis na newsletter),\n- sprzedaż konkretnego produktu/usługi,\n- prezentacja portfolio lub oferty,\n- zapis na wydarzenie / webinar,\n- inny (jaki?).\n\n1.2. Do kogo jest kierowana strona (grupa docelowa)?\n- wiek, branża, poziom wiedzy technicznej,\n- kraj / język (czy strona tylko po polsku, czy wielojęzyczna?).\n\n1.3. W jednym–dwóch zdaniach: jak chcesz opisać swój produkt/usługę/projekt?\n\n1.4. Czy masz nazwę marki/firmy/produktu i slogan?\n- nazwa:\n- slogan/tagline (jeśli jest):\n\n---\n\n### 2. Struktura i sekcje strony\n\nZaznacz, które sekcje mają być na stronie, i opisz ich treść. Jeśli niektórych nie potrzebujesz – napisz to wprost.\n\n2.1. Sekcja hero (górna, pierwszy ekran):\n- główny nagłówek (H1),\n- krótki opis (1–3 zdani y stylizowana CSS-em)?\n\n---\n\n### 5. Elementy interaktywne (JavaScript)\n\n5.1. Jakie elementy interaktywne chcesz? Zaznacz i doprecyzuj:\n- animowane przewijanie do sekcji,\n- rozwijane FAQ (akordeon),\n- slider opinii / galerii (ile elementów, co się ma przewijać),\n- licznik odliczający (countdown) – do jakiej daty/wydarzenia,\n- modal/okno popup (np. po kliknięciu przycisku; co ma się w nim wyświetlać),\n- walidacja formularza (jakie pola są obowiązkowe, jakie zasady walidacji),\n- inne (jakie dokładnie?).\n\n5.2. JavaScript:\n- ma być napisany „czystym” JS (bez frameworków typu React, Vue, Angular)?  \n- czy unikać też bibliotek typu jQuery, czy dopuszczasz jakąś konkretną lekką bibliotekę (podaj nazwę, jeśli tak)?\n\n5.3. Animacje / efekty:\n- animacje wejścia sekcji przy przewijaniu (delikatne / bardziej wyraźne),\n- efekty hover na przyciskach/kartach,\n- inne (opisz, jeśli masz inspiracje lub linki referencyjne).\n\n---\n\n### 6. Responsywność i urządzenia\n\n6.1. Czy strona ma być w pełni responsywna (desktop, tablet, telefon)?  \n6.2. Czy są konkretne wymagania co do layoutu na mobile?\n- np. inna kolejność sekcji,\n- ukrycie niektórych elementów,\n- inny tekst CTA, krótsze nagłówki itp.\n\n---\n\n### 7. Wydajność, SEO i dostępność\n\n7.1. SEO:\n- docelowe słowa kluczowe (po jakich frazach chcesz być znajdowany),\n- tytuł strony (tag `\u003ctitle\u003e`),\n- opis meta description (jeśli nie masz, mogę go zaproponować, ale potrzebuję opisu Twojego biznesu).\n\n7.2. Czy potrzebujesz:\n- poprawnej struktury nagłówków (H1, H2, H3),\n- tagów alt dla obrazków (jeśli tak, podaj nazwy/tematy obrazków lub pozwól na ogólne opisy),\n- przyjaznych nazw sekcji/id (np. `id=\"o-nas\"`, `id=\"oferta\"`).\n\n7.3. Dostępność (a11y):\n- czy są szczególne wymagania (np. wysoki kontrast, rozmiary czcionki, dostosowanie pod czytniki ekranowe, obsługa klawiaturą),\n- czy chcesz, abym domyślnie zadbał o podstawową dostępność (semantyczne znaczniki, aria-labels tam, gdzie potr zy muszę mieć swój sprzęt?”  \n- „Czy wydarzenie jest dla początkujących?”  \n- „Czy opłata obejmuje licencję/pozwolenie?”  \n\nTreści odpowiedzi – Twoja propozycja (logiczna, spójna, raczej neutralna).\n\n#### 2.8. Sekcja kontakt / formularz\n\nMa zawierać:\n\n- Formularz z polami:\n  - imię,\n  - e-mail,\n  - telefon,\n  - wiadomość.\n- Formularz ma być **tylko front-endowy**:\n  - brak faktycznej integracji z backendem,\n  - walidacja po stronie front-end (np. wymagane imię, poprawny e-mail),\n  - po poprawnym „wysłaniu” – wyświetlenie komunikatu sukcesu (np. pod formularzem lub w prostym modalu).\n- Możesz dodać prosty tekst zachęcający do kontaktu, np. „Masz pytanie o zasady zawodów? Napisz do nas.”\n\nDodatkowe dane kontaktowe:\n\n- Placeholder dla:\n  - e-maila (np. `kontakt@popracynaryby.pl`),\n  - telefonu (np. `+48 000 000 000`),\n- Zaznacz w kodzie komentarzem, że to pola do podmiany.\n\n#### 2.9. Stopka (footer)\n\nPowinna zawierać:\n\n- Nazwę firmy/organizatora (tu: „Po pracy na ryby” lub placeholder, jeśli wolisz dopisać „Organizator: [Nazwa firmy]”).\n- Rok (np. aktualny albo placeholder, oznaczony w komentarzu).\n- Linki:\n  - Regulamin – np. `href=\"#regulamin\"` lub placeholderowy link z zaznaczeniem komentarza,\n  - Polityka prywatności – analogicznie.\n- Możesz dodać prostą linię tekstu o prawach autorskich.\n\n#### 2.10. Galeria + licznik odliczający\n\n- Sekcja GALERIA:\n  - Przewidziane miejsce na kilka zdjęć z poprzednich edycji (użyj placeholderów, np. `img/gallery1.jpg` itd. z komentarzem w kodzie, żeby podmienić).\n  - Krótkie opisy pod zdjęciami (1 zdanie każde, opisujące klimat zawodów).\n\n- Licznik odliczający (COUNTDOWN):\n  - W tej samej sekcji lub osobnej – np. „Do startu zawodów pozostało:”\n  - Odliczanie w czystym JavaScript do przykładowej daty w przyszłości (np. 30 czerwca 2027, 18:00).  \n  - W komentarzu w kodzie jasno napisz, gdzie zmienić datę.\n\n---\n\n### 3. Treści tekstowe i język\n\n- Język: wyłącznie **polski**.\n- Treści:  \n  - Masz samodzielnie zaproponować wszystkie teksty do sekcji na podstawie tej specyfikacji.  \n  - Styl: marketingowo-sprzedażowy, ale nienachalny; zachęcający, lekko emocjonalny, z akcentem na:\n    - relaks po pracy,\n    - społeczność wędkarską,\n    - klimat nad jeziorem.\n- Unikaj przesadnych obietnic; tekst ma brzmieć wiarygodnie.\n\n---\n\n### 4. Identyfikacja wizualna i layout\n\n4.1. Kolory:\n\n- Główne motywy kolorystyczne:\n  - zielony „trawiasty” (np. #2E7D32, możesz dobrać zbliżony odcień),\n  - niebieski „wodny” (np. #1565C0 lub podobny).\n- Użyj tych dwóch jako bazowych (tła, przyciski, akcenty).  \n- Dbaj o kontrast tekstu i tła (czytelność).\n\n4.2. Fonty:\n\n- Wybierz czytelny font bezszeryfowy z Google Fonts (np. „Inter”, „Roboto”, „Lato” – zdecyduj sam).  \n- Załaduj font poprawnie w `index.html` lub `style.css`.  \n- Zadbaj, by nagłówki i treść były spójne (np. ten sam krój w różnych grubościach).\n\n4.3. Styl graficzny:\n\n- Oparty na **zdjęciach**: w tle hero oraz w galerii.\n- Gdzie nie ma realnych zdjęć – użyj placeholderów i w komentarzach opisz, że należy je podmienić.\n\n4.4. Układ:\n\n- Strona typu **one page**, sekcyjna, przewijana w dół.  \n- Na górze **sticky navbar** (nawigacja przyklejona podczas przewijania).\n- W menu linki przewijające do sekcji (anchor links), np.:\n  - „O wydarzeniu” → `#o-wydarzeniu`\n  - „Nagrody” → `#nagrody`\n  - „Galeria” → `#galeria`\n  - „Cennik” → `#cennik`\n  - „Opinie” → `#opinie`\n  - „Kontakt” → `#kontakt`\n- Użyj czytelnych `id` sekcji, zgodnych z powyższymi nazwami (po polsku, z myślnikami).\n\n4.5. Logo:\n\n- Wymyśl **proste, tekstowe logo**:\n  - bazuje na nazwie „Po pracy na ryby”,\n  - możesz użyć prostego elementu graficznego via CSS (np. ikonka-znacznik z pseudo-elementem, albo stylizowane litery).\n- Jeśli używasz obrazka – załóż placeholder `img/logo.png` z komentarzem, że należy podmienić.\n\n---\n\n### 5. Elementy interaktywne (JavaScript)\n\n5.1. Wymagane elementy:\n\n- **Licznik odliczający (countdown)**:\n  - Odliczanie do zdefiniowanej daty wydarzenia (np. 30 czerwca 2027, 18:00 – możesz przyjąć taką lub podobną, ważne: w komentarzu w JS wyjaśnij, jak ją zmienić).\n  - Po dojściu do zera – tekst typu „Zawody właśnie trwają!” lub podobny.\n\n- Animowane przewijanie do sekcji (smooth scroll) po kliknięciu w linki w nawigacji.\n\n- Walidacja formularza:\n  - Imię – wymagane, niepuste,\n  - E-mail – wymagany, prosty regex na poprawny format,\n  - Telefon – wymagany lub opcjonalny (wybierz jedną opcję, zaznacz to w komentarzu),\n  - Wiadomość – może być wymagana lub opcjonalna, opisz krótko w kodzie (komentarz).\n  - Przy błędach – wyświetlaj krótkie komunikaty obok pól lub pod formularzem.\n  - Przy powodzeniu – pokaż czytelny komunikat typu „Dziękujemy za zgłoszenie! Skontaktujemy się z Tobą.”\n\n5.2. Technologia JS:\n\n- Użyj **czystego JavaScriptu** (Vanilla JS).  \n- Bez frameworków (React, Vue, Angular, itp.).  \n- Bez jQuery ani innych zewnętrznych bibliotek JS.\n\n5.3. Animacje / efekty:\n\n- Delikatne efekty „hover” na przyciskach i kartach (CSS).\n- Możesz dodać lekkie animacje pojawiania się sekcji przy przewijaniu (własne, proste w JS + CSS), ale nie używaj zewnętrznych bibliotek – jeśli dodasz, opisz w komentarzu strukturę i sposób działania.\n\n---\n\n### 6. Responsywność\n\n- Strona ma być **w pełni responsywna**:\n  - desktop, tablet, telefon.\n- Zadbaj, aby:\n  - menu na mobile było wygodne (może być proste „hamburger menu” w JS lub po prostu pionowa lista pod logo – wybierz prostsze, ale funkcjonalne rozwiązanie),\n  - sekcje dobrze się składały (kolumny → jeden pod drugim),\n  - tekst nie był za mały.\n\n---\n\n### 7. SEO i dostępność\n\n7.1. SEO:\n\n- Słowa kluczowe (wpleć naturalnie w treść):\n  - „wędkarstwo”, „konkurs”, „Toruń”, „zawody”, „ryby”.\n- Tytuł strony (`\u003ctitle\u003e`):\n  - Zaproponuj tytuł w stylu:\n    - „Po pracy na ryby – zawody wędkarskie spinningowe pod Toruniem” (lub podobny, logiczny).\n- Meta description:\n  - Napisz 1–2 zdaniowy opis zachęcający do udziału, z wykorzystaniem kilku słów kluczowych.\n\n7.2. Struktura i atrybuty:\n\n- Użyj poprawnej struktury nagłówków:\n  - Jedno `\u003ch1\u003e` w sekcji hero,\n  - Podsekcje z `\u003ch2\u003e` itd.\n- Dodaj `alt` do wszystkich obrazków (jeśli to placeholdery, opisz je ogólnie, np. „Zdjęcie wędkarzy nad jeziorem”).\n- Użyj czytelnych `id` sekcji (po polsku, z myślnikami).\n\n7.3. Dostępność:\n\n- Zadbaj o:\n  - odpowiedni kontrast tekst/tło,\n  - możliwość nawigacji po kluczowych elementach klawiaturą,\n  - etykiety dla pól formularza (`\u003clabel for=\"...\"\u003e`),\n  - aria-labels tam, gdzie potrzeba (np. przy nawigacji, jeśli wymaga wyjaśnienia).\n\n---\n\n### 8. Hosting i struktura plików\n\n8.1. Hosting:\n\n- Strona będzie na **statycznym hostingu GitHub Pages**.  \n- Kod ma działać bez żadnego backendu – wszystko ma się renderować po stronie klienta.\n\n8.2. Pliki:\n\n- Wygeneruj trzy osobne pliki:\n  - `index.html`\n  - `style.css`\n  - `script.js`\n- W `index.html` poprawne podpięcie CSS i JS (ścieżki względne, np. `./style.css`, `./script.js`).\n\n8.3. Komentarze:\n\n- Dodaj **komentarze po polsku**:\n  - w `index.html` – opisujące strukturę sekcji,\n  - w `style.css` – krótko opisujące bloki stylów (np. sekcje, nawigacja, przyciski),\n  - w `script.js` – wyjaśniające logikę (licznik, walidacja formularza, smooth scroll, ewentualne animacje).\n\n---\n\n### 9. Co masz zrobić krok po kroku\n\n1. Najpierw wypisz krótkie **podsumowanie projektu** w 5–10 punktach (bez kodu):  \n   - cel strony,  \n   - główne sekcje,  \n   - styl graficzny i kolorystyka,  \n   - główne funkcje JS,  \n   - technologia (HTML/CSS/JS, brak frameworków).  \n\n2. Następnie wygeneruj kompletny kod trzech plików:\n   - `index.html`\n   - `style.css`\n   - `script.js`\n\n3. Kod ma być gotowy do wrzucenia na GitHub Pages i działania „od razu”.\n\nNie zgaduj niczego poza tym, co wyraźnie zostało Ci tu dozwolone (np. placeholdery, przykładowe daty, kwoty, zdjęcia). Wszystkie takie miejsca oznaczaj w kodzie czytelnymi komentarzami po polsku."])</script><script>self.__next_f.push([1,"3b:T887d,"])</script><script>self.__next_f.push([1,"Poniżej masz kompletny, gotowy projekt: `index.html`, `style.css` i `script.js`. Skopiuj je do trzech plików w repozytorium GitHub (np. w katalogu głównym) i włącz GitHub Pages – strona powinna działać od razu.\n\nPrzyjąłem przykładową datę wydarzenia: **30 czerwca 2027, godz. 18:00**. W `script.js` jest komentarz, gdzie to zmienić.  \nPrzyjąłem przykładową cenę: **199 zł** – oznaczone komentarzem w HTML.\n\n---\n\n## index.html\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pl\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003ePo pracy na ryby – zawody wędkarskie spinningowe pod Toruniem\u003c/title\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003cmeta name=\"description\" content=\"Po pracy na ryby – zawody wędkarskie spinningowe pod Toruniem. Zrelaksuj się po pracy, poznaj innych pasjonatów wędkarstwa i powalcz o profesjonalny sprzęt oraz puchar zawodów.\"\u003e\n\n    \u003c!-- Ładowanie fontu z Google Fonts --\u003e\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n    \u003clink rel=\"stylesheet\" href=\"style.css\"\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003c!-- GŁÓWNA NAWIGACJA / HEADER --\u003e\n    \u003cheader class=\"site-header\"\u003e\n        \u003cdiv class=\"container header-inner\"\u003e\n            \u003c!-- Logo tekstowe --\u003e\n            \u003cdiv class=\"logo\"\u003e\n                \u003c!-- Możesz później podmienić na obrazek \u003cimg src=\"img/logo.png\" alt=\"Po pracy na ryby\"\u003e --\u003e\n                \u003cspan class=\"logo-icon\"\u003e\u003c/span\u003e\n                \u003cspan class=\"logo-text\"\u003ePo pracy na  \u003cdiv class=\"countdown-wrapper\" aria-label=\"Odliczanie do rozpoczęcia zawodów\"\u003e\n                \u003ch2\u003eDo startu zawodów pozostało:\u003c/h2\u003e\n                \u003cdiv class=\"countdown\" id=\"countdown\"\u003e\n                    \u003cdiv class=\"countdown-item\"\u003e\n                        \u003cspan class=\"countdown-number\" id=\"days\"\u003e0\u003c/span\u003e\n                        \u003cspan class=\"countdown-label\"\u003edni\u003c/span\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"countdown-item\"\u003e\n                        \u003cspan class=\"countdown-number\" id=\"hours\"\u003e0\u003c/span\u003e\n                        \u003cspan class=\"countdown-label\"\u003egodzin\u003c/span\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"countdown-item\"\u003e\n                        \u003cspan class=\"countdown-number\" id=\"minutes\"\u003e0\u003c/span\u003e\n                        \u003cspan class=\"countdown-label\"\u003eminut\u003c/span\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"countdown-item\"\u003e\n                        \u003cspan class=\"countdown-number\" id=\"seconds\"\u003e0\u003c/span\u003e\n                        \u003cspan class=\"countdown-label\"\u003esekund\u003c/span\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n                \u003cp class=\"countdown-message\" id=\"countdown-message\"\u003e\u003c/p\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- SEKCJA O WYDARZENIU --\u003e\n    \u003csection class=\"section\" id=\"o-wydarzeniu\"\u003e\n        \u003cdiv class=\"container\"\u003e\n            \u003ch2\u003eO wydarzeniu „Po pracy na ryby”\u003c/h2\u003e\n            \u003cp\u003e\n                „Po pracy na ryby” to wyjątkowe zawody wędkarskie spinningowe dla osób, które po dniu pełnym obowiązków chcą złapać oddech nad wodą.\n                Spotykamy się nad malowniczym jeziorem niedaleko Torunia, żeby wspólnie odpocząć, powędkować i wymienić się doświadczeniami.\n            \u003c/p\u003e\n            \u003cp\u003e\n                Niezależnie od tego, czy łowisz od lat, czy dopiero zaczynasz przygodę ze spinningiem – znajdziesz tu przyjazną atmosferę,\n                nowe znajomości i dawkę zdrowej, sportowej rywalizacji.\n            \u003c/p\u003e\n\n            \u003cdiv class=\"benefits-grid\"\u003e\n                \u003cdiv class=\"benefit-card\"\u003e\n                    \u003ch3\u003eRelaks po pracy\u003c/h3\u003e\n                    \u003cp\u003eOderwij się od biurka, miejskich korków i codziennego stresu. Zamiast ekranu komputera – zachód słońca nad wodą.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"benefit-card\"\u003e\n                    \u003ch3\u003eNowe znajomości\u003c/h3\u003e\n                    \u003cp\u003ePoznaj innych pasjonatów wędkarstwa, wymień się tipami, zainspiruj nowymi technikami i przynętami.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"benefit-card\"\u003e\n                    \u003ch3\u003eWymiana doświadczeń\u003c/h3\u003e\n                    \u003cp\u003ePorozmawiaj z bardziej doświadczonymi wędkarzami, podpatrz ich patenty i modernizuj swój styl łowienia.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"benefit-card\"\u003e\n                    \u003ch3\u003eKameralna atmosfera\u003c/h3\u003e\n                    \u003cp\u003eOgraniczona liczba miejsc sprawia, że na zawodach panuje swobodna atmosfera i każdy czuje się częścią ekipy.\u003c/p\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- SEKCJA JAK TO DZIAŁA --\u003e\n    \u003csection class=\"section section-alt\" id=\"jak-to-dziala\"\u003e\n        \u003cdiv class=\"container\"\u003e\n            \u003ch2\u003eJak wyglądają zawody?\u003c/h2\u003e\n            \u003cdiv class=\"steps-grid\"\u003e\n                \u003cdiv class=\"step-card\"\u003e\n                    \u003cspan class=\"step-number\"\u003e1\u003c/span\u003e\n                    \u003ch3\u003eRejestracja online\u003c/h3\u003e\n                    \u003cp\u003eWypełnij krótki formularz zgłoszeniowy, a my odezwiemy się do Ciebie z potwierdzeniem udziału i szczegółami dojazdu.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"step-card\"\u003e\n                    \u003cspan class=\"step-number\"\u003e2\u003c/span\u003e\n                    \u003ch3\u003eSpotkanie nad jeziorem\u003c/h3\u003e\n                    \u003cp\u003eW wyznaczonym dniu widzimy się na miejscu startu. Krótkie omówienie zasad, losowanie stanowisk i przygotowanie sprzętu.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"step-card\"\u003e\n                    \u003cspan class=\"step-number\"\u003e3\u003c/span\u003e\n                    \u003ch3\u003eZawody i ważenie ryb\u003c/h3\u003e\n                    \u003cp\u003eŁowimy zgodnie z regulaminem. Po zakończeniu sędziowie ważą złowione ryby i wyłaniają zwycięzców.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"step-card\"\u003e\n                    \u003cspan class=\"step-number\"\u003e4\u003c/span\u003e\n                    \u003ch3\u003ePuchar i integracja\u003c/h3\u003e\n                    \u003cp\u003eWręczamy nagrody, puchar i zapraszamy na wspólną integrację przy posiłku oraz ognisku.\u003c/p\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- SEKCJA NAGRODY --\u003e\n    \u003csection class=\"section\" id=\"nagrody\"\u003e\n        \u003cdiv class=\"container\"\u003e\n            \u003ch2\u003eCo możesz wygrać?\u003c/h2\u003e\n            \u003cdiv class=\"rewards-grid\"\u003e\n                \u003cdiv class=\"reward-card\"\u003e\n                    \u003ch3\u003eProfesjonalny sprzęt wędkarski\u003c/h3\u003e\n                    \u003cp\u003eZwycięzcy otrzymują wysokiej klasy wędki, kołowrotki i akcesoria spinningowe, idealne na kolejne wyprawy.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"reward-card\"\u003e\n                    \u003ch3\u003ePuchar „Po pracy na ryby”\u003c/h3\u003e\n                    \u003cp\u003eOkazały puchar zawodów, który możesz dumnie postawić na półce i przypominać sobie emocje z łowiska.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"reward-card\"\u003e\n                    \u003ch3\u003eUznanie wśród wędkarzy\u003c/h3\u003e\n                    \u003cp\u003eTytuł zwycięzcy edycji to coś więcej niż nagroda – to respekt i uznanie w społeczności pasjonatów wędkarstwa.\u003c/p\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- SEKCJA CENNIK --\u003e\n    \u003csection class=\"section section-alt\" id=\"cennik\"\u003e\n        \u003cdiv class=\"container\"\u003e\n            \u003ch2\u003eCennik uczestnictwa\u003c/h2\u003e\n            \u003cdiv class=\"pricing-card\"\u003e\n                \u003ch3\u003ePakiet standard\u003c/h3\u003e\n                \u003cp class=\"price\"\u003e\n                    \u003c!-- Możesz zmienić wysokość opłaty według potrzeb --\u003e\n                    199 zł \u003cspan\u003e/ osoba\u003c/span\u003e\n                \u003c/p\u003e\n                \u003cul\u003e\n                    \u003cli\u003eUdział w zawodach spinningowych\u003c/li\u003e\n                    \u003cli\u003eCiepły posiłek po zawodach\u003c/li\u003e\n                    \u003cli\u003eNapoje (kawa, herbata, woda)\u003c/li\u003e\n                    \u003cli\u003eGrill / ognisko integracyjne\u003c/li\u003e\n                    \u003cli\u003eDrobny serwis sprzętowy na miejscu (regulacja zestawów, porady ekspertów)\u003c/li\u003e\n                \u003c/ul\u003e\n                \u003cp class=\"pricing-note\"\u003eLiczba miejsc jest ograniczona – decyduje kolejność zgłoszeń.\u003c/p\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- SEKCJA GALERIA + ODLICZANIE (odliczanie już w HERO, tu głównie zdjęcia) --\u003e\n    \u003csection class=\"section\" id=\"galeria\"\u003e\n        \u003cdiv class=\"container\"\u003e\n            \u003ch2\u003eGaleria poprzednich edycji\u003c/h2\u003e\n            \u003cp\u003eZobacz, jak wygląda klimat naszych zawodów – woda, zachody słońca i uśmiechnięci wędkarze.\u003c/p\u003e\n\n            \u003cdiv class=\"gallery-grid\"\u003e\n                \u003c!-- Obrazy są placeholderami – podmień ścieżki na realne zdjęcia --\u003e\n                \u003cfigure class=\"gallery-item\"\u003e\n                    \u003cimg src=\"img/gallery1.jpg\" alt=\"Wędkarze nad jeziorem o zachodzie słońca\"\u003e\n                    \u003cfigcaption\u003eWieczorne łowienie w spokojnej, kameralnej atmosferze.\u003c/figcaption\u003e\n                \u003c/figure\u003e\n                \u003cfigure class=\"gallery-item\"\u003e\n                    \u003cimg src=\"img/gallery2.jpg\" alt=\"Zwycięzca zawodów z pucharem\"\u003e\n                    \u003cfigcaption\u003eUśmiech zwycięzcy i puchar „Po pracy na ryby”.\u003c/figcaption\u003e\n                \u003c/figure\u003e\n                \u003cfigure class=\"gallery-item\"\u003e\n                    \u003cimg src=\"img/gallery3.jpg\" alt=\"Wędkarze przygotowujący sprzęt nad brzegiem jeziora\"\u003e\n                    \u003cfigcaption\u003ePrzygotowania do startu – wymiana doświadczeń i porad sprzętowych.\u003c/figcaption\u003e\n                \u003c/figure\u003e\n            \u003c/div\u003e\n            \u003cp class=\"gallery-note\"\u003e* Podane zdjęcia są przykładowe – podmień je na fotografie z Twojego wydarzenia.\u003c/p\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- SEKCJA OPINIE --\u003e\n    \u003csection class=\"section section-alt\" id=\"opinie\"\u003e\n        \u003cdiv class=\"container\"\u003e\n            \u003ch2\u003eCo mówią uczestnicy?\u003c/h2\u003e\n            \u003cdiv class=\"testimonials-grid\"\u003e\n                \u003carticle class=\"testimonial\"\u003e\n                    \u003cp\u003e„Świetny sposób, żeby oderwać się od pracy za biurkiem. Spokojna atmosfera, fajni ludzie i solidna dawka emocji przy holowaniu ryb.”\u003c/p\u003e\n                    \u003cp class=\"testimonial-meta\"\u003e\n                        \u003cspan class=\"testimonial-name\"\u003eMarek\u003c/span\u003e,\n                        \u003cspan class=\"testimonial-role\"\u003especjalista IT i wędkarz amator\u003c/span\u003e,\n                        \u003cspan class=\"testimonial-company\"\u003eTechSoft\u003c/span\u003e\n                    \u003c/p\u003e\n                \u003c/article\u003e\n                \u003carticle class=\"testimonial\"\u003e\n                    \u003cp\u003e„Od lat łowię, ale dopiero tutaj poczułem, jak fajnie jest spotkać tylu pasjonatów w jednym miejscu. Organizacja na wysokim poziomie.”\u003c/p\u003e\n                    \u003cp class=\"testimonial-meta\"\u003e\n                        \u003cspan class=\"testimonial-name\"\u003eAndrzej\u003c/span\u003e,\n                        \u003cspan class=\"testimonial-role\"\u003ekierownik sprzedaży\u003c/span\u003e,\n                        \u003cspan class=\"testimonial-company\"\u003eHandelPlus\u003c/span\u003e\n                    \u003c/p\u003e\n                \u003c/article\u003e\n                \u003carticle class=\"testimonial\"\u003e\n                    \u003cp\u003e„Nie chodzi tylko o wyniki – zawody to pretekst, żeby spędzić czas nad wodą i złapać dystans do codziennych obowiązków.”\u003c/p\u003e\n                    \u003cp class=\"testimonial-meta\"\u003e\n                        \u003cspan class=\"testimonial-name\"\u003ePiotr\u003c/span\u003e,\n                        \u003cspan class=\"testimonial-role\"\u003ewłaściciel małej firmy\u003c/span\u003e,\n                        \u003cspan class=\"testimonial-company\"\u003eUsługiBud\u003c/span\u003e\n                    \u003c/p\u003e\n                \u003c/article\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- SEKCJA KONTAKT / FORMULARZ --\u003e\n    \u003csection class=\"section\" id=\"kontakt\"\u003e\n        \u003cdiv class=\"container contact-grid\"\u003e\n            \u003cdiv class=\"contact-info\"\u003e\n                \u003ch2\u003eZapisz się na zawody lub zadaj pytanie\u003c/h2\u003e\n                \u003cp\u003eWypełnij formularz, a skontaktujemy się z Tobą w sprawie szczegółów udziału, regulaminu i organizacji wyjazdu.\u003c/p\u003e\n\n                \u003cul class=\"contact-list\"\u003e\n                    \u003c!-- Poniższe dane są przykładowe – podmień na swoje --\u003e\n                    \u003cli\u003e\u003cstrong\u003eE-mail:\u003c/strong\u003e \u003ca href=\"mailto:kontakt@popracynaryby.pl\"\u003ekontakt@popracynaryby.pl\u003c/a\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003eTelefon:\u003c/strong\u003e \u003ca href=\"tel:+48000000000\"\u003e+48 000 000 000\u003c/a\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003eLokalizacja:\u003c/strong\u003e okolice Torunia, jezioro – dokładne miejsce w potwierdzeniu\u003c/li\u003e\n                \u003c/ul\u003e\n            \u003c/div\u003e\n\n            \u003cdiv class=\"contact-form-wrapper\"\u003e\n                \u003cform id=\"contact-form\" novalidate\u003e\n                    \u003cdiv class=\"form-group\"\u003e\n                        \u003clabel for=\"name\"\u003eImię*\u003c/label\u003e\n                        \u003cinput type=\"text\" id=\"name\" name=\"name\" required\u003e\n                        \u003csmall class=\"error-message\" data-for=\"name\"\u003e\u003c/small\u003e\n                    \u003c/div\u003e\n\n                    \u003cdiv class=\"form-group\"\u003e\n                        \u003clabel for=\"email\"\u003eE-mail*\u003c/label\u003e\n                        \u003cinput type=\"email\" id=\"email\" name=\"email\" required\u003e\n                        \u003csmall class=\"error-message\" data-for=\"email\"\u003e\u003c/small\u003e\n                    \u003c/div\u003e\n\n                    \u003cdiv class=\"form-group\"\u003e\n                        \u003clabel for=\"phone\"\u003eTelefon*\u003c/label\u003e\n                        \u003c!-- W tym projekcie telefon jest wymagany --\u003e\n                        \u003cinput type=\"tel\" id=\"phone\" name=\"phone\" required\u003e\n                        \u003csmall class=\"error-message\" data-for=\"phone\"\u003e\u003c/small\u003e\n                    \u003c/div\u003e\n\n                    \u003cdiv class=\"form-group\"\u003e\n                        \u003clabel for=\"message\"\u003eWiadomość (np. pytanie o regulamin)\u003c/label\u003e\n                        \u003ctextarea id=\"message\" name=\"message\" rows=\"4\"\u003e\u003c/textarea\u003e\n                        \u003csmall class=\"error-message\" data-for=\"message\"\u003e\u003c/small\u003e\n                    \u003c/div\u003e\n\n                    \u003cbutton type=\"submit\" class=\"btn btn-primary\"\u003eWyślij zgłoszenie\u003c/button\u003e\n                    \u003cp class=\"form-success-message\" id=\"form-success-message\"\u003e\u003c/p\u003e\n                \u003c/form\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- STOPKA --\u003e\n    \u003cfooter class=\"site-footer\"\u003e\n        \u003cdiv class=\"container footer-inner\"\u003e\n            \u003cp\u003e© \u003cspan id=\"current-year\"\u003e\u003c/span\u003e Po pracy na ryby. Wszelkie prawa zastrzeżone.\u003c/p\u003e\n            \u003cdiv class=\"footer-links\"\u003e\n                \u003c!-- Placeholdery – podmień href na właściwe adresy stron z regulaminem i polityką --\u003e\n                \u003ca href=\"#regulamin\"\u003eRegulamin\u003c/a\u003e\n                \u003ca href=\"#polityka-prywatnosci\"\u003ePolityka prywatności\u003c/a\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/footer\u003e\n\n    \u003cscript src=\"script.js\"\u003e\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n---\n\n## style.css\n\n```css\n/* \n====================================================\nGŁÓWNE USTAWIENIA GLOBALNE\n==================================================== \n*/\n\n*,\n*::before,\n*::after {\n    box-sizing: border-box;\n}\n\nbody {\n    margin: 0;\n    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n    color: #1b1b1b;\n    background-color: #f5f7f9;\n    line-height: 1.6;\n}\n\nimg {\n    max-width: 100%;\n    height: auto;\n    display: block;\n}\n\na {\n    color: inherit;\n    text-decoration: none;\n}\n\na:hover {\n    text-decoration: underline;\n}\n\nh1, h2, h3, h4 {\n    margin-top: 0;\n    font-weight: 700;\n    color: #123047;\n}\n\np {\n    margin-top: 0;\n    margin-bottom: 1rem;\n}\n\n/* Kontener o maksymalnej szerokości */\n.container {\n    width: 100%;\n    max-width: 1100px;\n    margin: 0 auto;\n    padding: 0 16px;\n}\n\n/* Przyciski */\n.btn {\n    display: inline-block;\n    padding: 0.8rem 1.8rem;\n    border-radius: 999px;\n    border: none;\n    font-weight: 600;\n    cursor: pointer;\n    text-align: center;\n    transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.1s ease;\n}\n\n.btn-primary {\n    background: linear-gradient(135deg, #2E7D32, #1565C0);\n    color: #ffffff;\n    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);\n}\n\n.btn-primary:hover {\n    background: linear-gradient(135deg, #27682a, #0f4f93);\n    transform: translateY(-1px);\n    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);\n}\n\n/* Sekcje */\n.section {\n    padding: 80px 0;\n    background-color: #f5f7f9;\n}\n\n.section-alt {\n    background-color: #ffffff;\n}\n\n/* \n====================================================\nHEADER I NAWIGACJA\n==================================================== \n*/\n\n.site-header {\n    position: sticky;\n    top: 0;\n    z-index: 1000;\n    background-color: rgba(18, 48, 71, 0.95);\n    backdrop-filter: blur(8px);\n    color: #ffffff;\n}\n\n.header-inner {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 12px 0;\n}\n\n/* Logo */\n.logo {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    font-weight: 700;\n    font-size: 1.1rem;\n}\n\n.logo-icon {\n    width: 28px;\n    height: 28px;\n    border-radius: 50%;\n    background: radial-gradient(circle at 30% 30%, #bbdefb, #1565C0);\n    position: relative;\n}\n\n/* Prosty „haczyk” przy logo */\n.logo-icon::after {\n    content: '';\n    position: absolute;\n    width: 12px;\n    height: 18px;\n    border: 2px solid #ffffff;\n    border-top: none;\n    border-right: none;\n    border-radius: 0 0 80% 80%;\n    left: 50%;\n    top: 20%;\n    transform: translateX(-50%) rotate(-15deg);\n}\n\n/* Nawigacja desktopowa */\n.main-nav ul {\n    list-style: none;\n    display: flex;\n    gap: 24px;\n    margin: 0;\n    padding: 0;\n}\n\n.main-nav a {\n    font-weight: 500;\n    font-size: 0.95rem;\n    padding: 6px 0;\n    position: relative;\n}\n\n.main-nav a::after {\n    content: '';\n    position: absolute;\n    left: 0;\n    bottom: -4px;\n    width: 0;\n    height: 2px;\n    background: #66bb6a;\n    transition: width 0.2s ease;\n}\n\n.main-nav a:hover::after {\n    width: 100%;\n}\n\n/* Przycisk hamburger dla mobile */\n.nav-toggle {\n    display: none;\n    flex-direction: column;\n    gap: 4px;\n    background: none;\n    border: none;\n    cursor: pointer;\n}\n\n.nav-toggle span {\n    display: block;\n    width: 22px;\n    height: 2px;\n    background-color: #ffffff;\n}\n\n/* \n====================================================\nSEKCJA HERO\n==================================================== \n*/\n\n.hero {\n    position: relative;\n    min-height: calc(100vh - 60px);\n    display: flex;\n    align-items: center;\n    color: #ffffff;\n    background-image: url('img/hero-placeholder.jpg'); /* Placeholder - podmień na realne zdjęcie jeziora */\n    background-size: cover;\n    background-position: center;\n}\n\n.hero-overlay {\n    position: absolute;\n    inset: 0;\n    background: linear-gradient(135deg, rgba(18, 48, 71, 0.9), rgba(21, 101, 192, 0.7));\n}\n\n.hero-content {\n    position: relative;\n    padding: 100px 0 60px;\n    max-width: 700px;\n}\n\n.hero h1 {\n    font-size: 2.2rem;\n    margin-bottom: 1rem;\n    color: #ffffff;\n}\n\n.hero p {\n    font-size: 1.05rem;\n    margin-bottom: 1.5rem;\n    max-width: 600px;\n}\n\n/* \n====================================================\nCOUNTDOWN\n==================================================== \n*/\n\n.countdown-wrapper {\n    margin-top: 2.5rem;\n    background-color: rgba(0, 0, 0, 0.3);\n    padding: 16px 20px;\n    border-radius: 12px;\n}\n\n.countdown-wrapper h2 {\n    font-size: 1.2rem;\n    margin-bottom: 0.8rem;\n    color: #e3f2fd;\n}\n\n.countdown {\n    display: flex;\n    gap: 12px;\n    flex-wrap: wrap;\n}\n\n.countdown-item {\n    flex: 1 1 80px;\n    padding: 8px 10px;\n    border-radius: 10px;\n    background-color: rgba(21, 101, 192, 0.7);\n    text-align: center;\n}\n\n.countdown-number {\n    display: block;\n    font-size: 1.4rem;\n    font-weight: 700;\n}\n\n.countdown-label {\n    font-size: 0.8rem;\n    opacity: 0.9;\n}\n\n.countdown-message {\n    margin-top: 0.8rem;\n    font-size: 0.95rem;\n    color: #bbdefb;\n}\n\n/* \n====================================================\nSEKCJE TREŚCI\n==================================================== \n*/\n\n.section h2 {\n    font-size: 1.9rem;\n    margin-bottom: 1.5rem;\n    text-align: center;\n}\n\n/* O wydarzeniu - karty korzyści */\n.benefits-grid {\n    display: grid;\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 20px;\n    margin-top: 2rem;\n}\n\n.benefit-card {\n    background-color: #ffffff;\n    border-radius: 12px;\n    padding: 16px 18px;\n    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);\n}\n\n/* Jak to działa - kroki */\n.steps-grid {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 20px;\n    margin-top: 2rem;\n}\n\n.step-card {\n    background-color: #f5f7f9;\n    border-radius: 12px;\n    padding: 16px 18px;\n    position: relative;\n    overflow: hidden;\n}\n\n.step-number {\n    position: absolute;\n    right: 12px;\n    top: 8px;\n    font-size: 2.5rem;\n    font-weight: 700;\n    color: rgba(21, 101, 192, 0.15);\n}\n\n/* Nagrody */\n.rewards-grid {\n    display: grid;\n    grid-template-columns: repeat(3, minmax(0, 1fr));\n    gap: 20px;\n    margin-top: 2rem;\n}\n\n.reward-card {\n    background-color: #ffffff;\n    border-radius: 12px;\n    padding: 18px 20px;\n    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);\n}\n\n/* Cennik */\n.pricing-card {\n    max-width: 420px;\n    margin: 0 auto;\n    background-color: #ffffff;\n    border-radius: 14px;\n    padding: 24px 26px;\n    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);\n}\n\n.pricing-card h3 {\n    margin-bottom: 0.8rem;\n}\n\n.pricing-card .price {\n    font-size: 2rem;\n    font-weight: 700;\n    color: #2E7D32;\n    margin-bottom: 1rem;\n}\n\n.pricing-card .price span {\n    font-size: 0.9rem;\n    font-weight: 400;\n    color: #555;\n}\n\n.pricing-card ul {\n    list-style: none;\n    padding: 0;\n    margin: 0 0 1rem 0;\n}\n\n.pricing-card ul li {\n    position: relative;\n    padding-left: 22px;\n    margin-bottom: 0.4rem;\n}\n\n.pricing-card ul li::before {\n    content: '✔';\n    position: absolute;\n    left: 0;\n    top: 0;\n    color: #2E7D32;\n    font-size: 0.9rem;\n}\n\n.pricing-note {\n    font-size: 0.9rem;\n    color: #555;\n}\n\n/* Galeria */\n.gallery-grid {\n    display: grid;\n    grid-template-columns: repeat(3, minmax(0, 1fr));\n    gap: 16px;\n    margin-top: 2rem;\n}\n\n.gallery-item {\n    background-color: #ffffff;\n    border-radius: 10px;\n    overflow: hidden;\n    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);\n}\n\n.gallery-item img {\n    width: 100%;\n    display: block;\n}\n\n.gallery-item figcaption {\n    padding: 8px 12px 10px;\n    font-size: 0.9rem;\n}\n\n.gallery-note {\n    margin-top: 0.5rem;\n    font-size: 0.85rem;\n    color: #777;\n}\n\n/* Opinie */\n.testimonials-grid {\n    display: grid;\n    grid-template-columns: repeat(3, minmax(0, 1fr));\n    gap: 20px;\n    margin-top: 2rem;\n}\n\n.testimonial {\n    background-color: #ffffff;\n    border-radius: 12px;\n    padding: 18px 20px;\n    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);\n    font-size: 0.95rem;\n}\n\n.testimonial-meta {\n    font-size: 0.85rem;\n    color: #555;\n    margin-top: 0.8rem;\n}\n\n.testimonial-name {\n    font-weight: 600;\n}\n\n/* Kontakt */\n.contact-grid {\n    display: grid;\n    grid-template-columns: 1.1fr 1fr;\n    gap: 32px;\n    align-items: flex-start;\n}\n\n.contact-list {\n    list-style: none;\n    padding: 0;\n    margin: 1.2rem 0 0 0;\n}\n\n.contact-list li {\n    margin-bottom: 0.4rem;\n}\n\n/* Formularz kontaktowy */\n.contact-form-wrapper {\n    background-color: #ffffff;\n    border-radius: 12px;\n    padding: 20px 22px;\n    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);\n}\n\n.form-group {\n    margin-bottom: 1rem;\n}\n\n.form-group label {\n    display: block;\n    font-size: 0.95rem;\n    margin-bottom: 0.25rem;\n}\n\n.form-group input,\n.form-group textarea {\n    width: 100%;\n    padding: 8px 10px;\n    border-radius: 6px;\n    border: 1px solid #cfd8dc;\n    font-family: inherit;\n    font-size: 0.95rem;\n}\n\n.form-group input:focus,\n.form-group textarea:focus {\n    outline: none;\n    border-color: #1565C0;\n    box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.15);\n}\n\n.error-message {\n    display: block;\n    font-size: 0.8rem;\n    color: #c62828;\n    min-height: 1em;\n}\n\n.form-success-message {\n    margin-top: 0.8rem;\n    font-size: 0.9rem;\n    color: #2E7D32;\n}\n\n/* \n====================================================\nSTOPKA\n==================================================== \n*/\n\n.site-footer {\n    background-color: #123047;\n    color: #ffffff;\n    padding: 16px 0;\n    font-size: 0.9rem;\n}\n\n.footer-inner {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n}\n\n.footer-links a {\n    margin-left: 12px;\n    font-weight: 500;\n    font-size: 0.9rem;\n}\n\n.footer-links a:hover {\n    text-decoration: underline;\n}\n\n/* \n====================================================\nEFECTY HOVER I ANIMACJE DELIKATNE\n==================================================== \n*/\n\n.benefit-card,\n.reward-card,\n.testimonial,\n.gallery-item,\n.step-card {\n    transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\n\n.benefit-card:hover,\n.reward-card:hover,\n.testimonial:hover,\n.gallery-item:hover,\n.step-card:hover {\n    transform: translateY(-3px);\n    box-shadow: 0 10px 18px rgba(0, 0, 0, 0.08);\n}\n\n/* \n====================================================\nRESPONSYWNOŚĆ\n==================================================== \n*/\n\n@media (max-width: 991px) {\n    .benefits-grid {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .steps-grid {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .rewards-grid {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .gallery-grid {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .testimonials-grid {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .contact-grid {\n        grid-template-columns: 1fr;\n    }\n}\n\n@media (max-width: 767px) {\n    .hero {\n        min-height: 80vh;\n    }\n\n    .hero-content {\n        padding-top: 80px;\n    }\n\n    .hero h1 {\n        font-size: 1.7rem;\n    }\n\n    .section {\n        padding: 60px 0;\n    }\n\n    .section h2 {\n        font-size: 1.6rem;\n    }\n\n    .benefits-grid,\n    .steps-grid,\n    .rewards-grid,\n    .gallery-grid,\n    .testimonials-grid {\n        grid-template-columns: 1fr;\n    }\n\n    /* Nawigacja - hamburger */\n    .main-nav {\n        display: none;\n        position: absolute;\n        right: 16px;\n        top: 56px;\n        background-color: rgba(18, 48, 71, 0.98);\n        padding: 12px 16px;\n        border-radius: 10px;\n    }\n\n    .main-nav.open {\n        display: block;\n    }\n\n    .main-nav ul {\n        flex-direction: column;\n        gap: 8px;\n    }\n\n    .nav-toggle {\n        display: flex;\n    }\n\n    .header-inner {\n        padding: 10px 0;\n    }\n\n    .footer-inner {\n        flex-direction: column;\n        align-items: flex-start;\n    }\n}\n```\n\n---\n\n## script.js\n\n```javascript\n/* \n====================================================\nSCRIPT.JS\nLogika:\n- Sticky nawigacja + hamburger na mobile\n- Płynne przewijanie do sekcji\n- Countdown do daty wydarzenia\n- Walidacja formularza i komunikaty\n- Ustawienie bieżącego roku w stopce\n==================================================== \n*/\n\n/* \n--------------------------------------------\nUstawienie bieżącego roku w stopce\n--------------------------------------------\n*/\nconst yearSpan = document.getElementById('current-year');\nif (yearSpan) {\n    yearSpan.textContent = new Date().getFullYear();\n}\n\n/* \n--------------------------------------------\nNawigacja mobilna (hamburger)\n--------------------------------------------\n*/\nconst navToggle = document.querySelector('.nav-toggle');\nconst mainNav = document.querySelector('.main-nav');\n\nif (navToggle \u0026\u0026 mainNav) {\n    navToggle.addEventListener('click', () =\u003e {\n        mainNav.classList.toggle('open');\n    });\n\n    // Zamknięcie menu po kliknięciu w link\n    mainNav.addEventListener('click', (e) =\u003e {\n        if (e.target.tagName === 'A') {\n            mainNav.classList.remove('open');\n        }\n    });\n}\n\n/* \n--------------------------------------------\nPłynne przewijanie do sekcji\n--------------------------------------------\n*/\ndocument.addEventListener('click', function (e) {\n    const target = e.target;\n    if (target.tagName === 'A' \u0026\u0026 target.getAttribute('href') \u0026\u0026 target.getAttribute('href').startsWith('#')) {\n        const id = target.getAttribute('href').slice(1);\n        const section = document.getElementById(id);\n        if (section) {\n            e.preventDefault();\n            section.scrollIntoView({ behavior: 'smooth', block: 'start' });\n        }\n    }\n});\n\n/* \n--------------------------------------------\nCOUNTDOWN DO WYDARZENIA\n--------------------------------------------\n\nZmień niżej datę wydarzenia na aktualną:\nPrzykład: now Date('2027-06-30T18:00:00');\n\nUwaga: Upewnij się, że format daty jest poprawny\ndla wszystkich przeglądarek (najbezpieczniej: YYYY-MM-DDTHH:MM:SS).\n*/\nconst countdownElement = document.getElementById('countdown');\nconst countdownMessage = document.getElementById('countdown-message');\n\nif (countdownElement) {\n    // USTAW TUTAJ DATĘ WYDARZENIA\n    const eventDate = new Date('2027-06-30T18:00:00');\n\n    function updateCountdown() {\n        const now = new Date();\n        const diff = eventDate.getTime() - now.getTime();\n\n        const daysEl = document.getElementById('days');\n        const hoursEl = document.getElementById('hours');\n        const minutesEl = document.getElementById('minutes');\n        const secondsEl = document.getElementById('seconds');\n\n        if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;\n\n        if (diff \u003c= 0) {\n            // Jeśli czas minął\n            daysEl.textContent = '0';\n            hoursEl.textContent = '0';\n            minutesEl.textContent = '0';\n            secondsEl.textContent = '0';\n\n            if (countdownMessage) {\n                countdownMessage.textContent = 'Zawody właśnie trwają lub już się zakończyły.';\n            }\n\n            // Zatrzymujemy interwał\n            clearInterval(countdownInterval);\n            return;\n        }\n\n        const seconds = Math.floor(diff / 1000) % 60;\n        const minutes = Math.floor(diff / 1000 / 60) % 60;\n        const hours = Math.floor(diff / 1000 / 60 / 60) % 24;\n        const days = Math.floor(diff / 1000 / 60 / 60 / 24);\n\n        daysEl.textContent = String(days);\n        hoursEl.textContent = String(hours).padStart(2, '0');\n        minutesEl.textContent = String(minutes).padStart(2, '0');\n        secondsEl.textContent = String(seconds).padStart(2, '0');\n\n        if (countdownMessage) {\n            countdownMessage.textContent = '';\n        }\n    }\n\n    // Aktualizacja co sekundę\n    const countdownInterval = setInterval(updateCountdown, 1000);\n    // Początkowe wywołanie\n    updateCountdown();\n}\n\n/* \n--------------------------------------------\nWALIDACJA FORMULARZA KONTAKTOWEGO\n--------------------------------------------\n*/\n\nconst contactForm = document.getElementById('contact-form');\nconst formSuccessMessage = document.getElementById('form-success-message');\n\nif (contactForm) {\n    contactForm.addEventListener('submit', function (e) {\n        e.preventDefault();\n\n        // Czyścimy poprzednie błędy\n        const errorMessages = contactForm.querySelectorAll('.error-message');\n        errorMessages.forEach(msg =\u003e {\n            msg.textContent = '';\n        });\n        if (formSuccessMessage) {\n            formSuccessMessage.textContent = '';\n        }\n\n        // Pobieramy pola\n        const nameInput = contactForm.querySelector('#name');\n        const emailInput = contactForm.querySelector('#email');\n        const phoneInput = contactForm.querySelector('#phone');\n        const messageInput = contactForm.querySelector('#message');\n\n        let hasError = false;\n\n        // Pomocnicza funkcja do ustawiania błędów\n        function setError(input, message) {\n            const fieldName = input.getAttribute('id');\n            const errorEl = contactForm.querySelector(`.error-message[data-for=\"${fieldName}\"]`);\n            if (errorEl) {\n                errorEl.textContent = message;\n            }\n            hasError = true;\n        }\n\n        // Walidacja imienia (wymagane)\n        if (!nameInput.value.trim()) {\n            setError(nameInput, 'Podaj swoje imię.');\n        }\n\n        // Walidacja e-maila (wymagany + prosty regex)\n        const emailValue = emailInput.value.trim();\n        if (!emailValue) {\n            setError(emailInput, 'Podaj swój adres e-mail.');\n        } else {\n            // Prosty wzorzec sprawdzający format e-mail\n            const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n            if (!emailPattern.test(emailValue)) {\n                setError(emailInput, 'Podaj poprawny adres e-mail.');\n            }\n        }\n\n        // Walidacja telefonu (w tym projekcie wymagany)\n        const phoneValue = phoneInput.value.trim();\n        if (!phoneValue) {\n            setError(phoneInput, 'Podaj swój numer telefonu.');\n        } else {\n            // Możesz doprecyzować wzorzec dla PL – poniżej prosty check cyfr\n            const phoneDigits = phoneValue.replace(/\\D/g, '');\n            if (phoneDigits.length \u003c 6) {\n                setError(phoneInput, 'Podaj poprawny numer telefonu (co najmniej 6 cyfr).');\n            }\n        }\n\n        // Wiadomość – opcjonalna, bez dodatkowej walidacji w tym projekcie\n\n        if (!hasError) {\n            // Tu normalnie wysłałbyś dane do serwera (fetch/AJAX).\n            // W tym projekcie tylko symulujemy wysłanie.\n            if (formSuccessMessage) {\n                formSuccessMessage.textContent = 'Dziękujemy za zgłoszenie! Skontaktujemy się z Tobą w sprawie szczegółów.';\n            }\n            contactForm.reset();\n        }\n    });\n}\n```\n\n---\n\nJeśli chcesz, mogę w kolejnym kroku podpowiedzieć dokładnie, jak:\n\n1. założyć repozytorium na GitHub,  \n2. wrzucić te trzy pliki,  \n3. włączyć GitHub Pages,  \n4. sprawdzić, czy wszystko działa."])</script><script>self.__next_f.push([1,"3c:T6e3,"])</script><script>self.__next_f.push([1,"Aby użyć tego zdjęcia jako tła sekcji głównej (hero), zrób trzy proste kroki:\n\n---\n\n### 1. Zapisz obraz w projekcie\n\n1. Zapisz zdjęcie na dysk (np. `pobrane_zdjecie.jpg`).\n2. W repozytorium utwórz folder `img` (jeśli jeszcze go nie ma).\n3. Wgraj tam plik i nazwij go np.:  \n   `hero-wedkarze.jpg`\n\nŚcieżka powinna wyglądać tak:  \n`/img/hero-wedkarze.jpg`\n\n---\n\n### 2. Zmień CSS (style.css)\n\nW pliku `style.css` znajdź fragment:\n\n```css\n.hero {\n    position: relative;\n    min-height: calc(100vh - 60px);\n    display: flex;\n    align-items: center;\n    color: #ffffff;\n    background-image: url('img/hero-placeholder.jpg'); /* Placeholder - podmień na realne zdjęcie jeziora */\n    background-size: cover;\n    background-position: center;\n}\n```\n\nZastąp go tym (lub tylko zmień linię `background-image`):\n\n```css\n.hero {\n    position: relative;\n    min-height: calc(100vh - 60px);\n    display: flex;\n    align-items: center;\n    color: #ffffff;\n    /* tu ustawiamy Twoje zdjęcie jako tło */\n    background-image: url('img/hero-wedkarze.jpg');\n    background-size: cover;\n    background-position: center center;\n    background-repeat: no-repeat;\n}\n```\n\nMożesz też lekko przyciemnić zdjęcie (żeby tekst był czytelny) – to już jest robione przez `.hero-overlay`, więc nic więcej nie musisz zmieniać.\n\n---\n\n### 3. Commit i push na GitHub\n\n1. Zacommituj nowy plik `img/hero-wedkarze.jpg` oraz zmiany w `style.css`.\n2. Wykonaj `git push`.\n3. Po chwili odśwież stronę GitHub Pages – sekcja główna powinna mieć już to zdjęcie jako tło.\n\nJeśli chcesz, mogę dopasować dodatkowo pozycjonowanie (np. bardziej pokazywać prawą/lewą stronę zdjęcia) lub zasugerować optymalny rozmiar pliku (kompresję) pod szybsze ładowanie."])</script><script>self.__next_f.push([1,"3d:T289a,"])</script><script>self.__next_f.push([1,"Pokażę Ci dwie rzeczy naraz:  \n1) jak „podpiąć” stronę z regulaminem pod link w stopce,  \n2) komplet gotowego kodu z nowym plikiem `regulamin.html`.\n\nZałożenie: chcesz osobną podstronę z regulaminem (nie tylko sekcję w tej samej stronie).  \n\n---\n\n## 1. Zmiana linku w stopce (index.html)\n\nW `index.html` w stopce znajdź:\n\n```html\n\u003cdiv class=\"footer-links\"\u003e\n    \u003c!-- Placeholdery – podmień href na właściwe adresy stron z regulaminem i polityką --\u003e\n    \u003ca href=\"#regulamin\"\u003eRegulamin\u003c/a\u003e\n    \u003ca href=\"#polityka-prywatnosci\"\u003ePolityka prywatności\u003c/a\u003e\n\u003c/div\u003e\n```\n\nZmień na:\n\n```html\n\u003cdiv class=\"footer-links\"\u003e\n    \u003c!-- Link do osobnej podstrony z regulaminem --\u003e\n    \u003ca href=\"regulamin.html\"\u003eRegulamin\u003c/a\u003e\n    \u003c!-- Na razie zostawiamy placeholder dla polityki --\u003e\n    \u003ca href=\"#polityka-prywatnosci\"\u003ePolityka prywatności\u003c/a\u003e\n\u003c/div\u003e\n```\n\nReszta `index.html`, `style.css` i `script.js` może zostać bez zmian (poza wcześniejszą zmianą tła hero, jeśli już ją wdrożyłeś).\n\n---\n\n## 2. Nowy plik: regulamin.html\n\nUtwórz w tym samym katalogu (co `index.html`) plik `regulamin.html` z poniższą treścią.  \nTo prosta, czytelna strona, która korzysta z tych samych fontów i stylu bazowego.\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pl\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eRegulamin – Po pracy na ryby\u003c/title\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003cmeta name=\"description\" content=\"Regulamin udziału w zawodach wędkarskich spinningowych Po pracy na ryby. Zapoznaj się z zasadami uczestnictwa, bezpieczeństwa i przetwarzania danych.\"\u003e\n\n    \u003c!-- Ten sam font co na stronie głównej --\u003e\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n    \u003cstyle\u003e\n        /* Proste style wewnątrz regulamin.html – niezależne od style.css */\n\n        * {\n            box-sizing: border-box;\n        }\n\n        body {\n            margin: 0;\n            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n            background-color: #f5f7f9;\n            color: #1b1b1b;\n            line-height: 1.6;\n        }\n\n        a {\n            color: #1565C0;\n            text-decoration: none;\n        }\n\n        a:hover {\n            text-decoration: underline;\n        }\n\n        .reg-container {\n            max-width: 900px;\n            margin: 0 auto;\n            padding: 24px 16px 40px;\n        }\n\n        header.reg-header {\n            background-color: #123047;\n            color: #ffffff;\n            padding: 18px 0;\n            margin-bottom: 24px;\n        }\n\n        header.reg-header .reg-container {\n            display: flex;\n            align-items: center;\n            justify-content: space-between;\n            gap: 12px;\n        }\n\n        .reg-logo {\n            font-weight: 700;\n        }\n\n        .reg-back-link a {\n            color: #bbdefb;\n            font-size: 0.95rem;\n        }\n\n        h1 {\n            margin: 0 0 0.4rem;\n            font-size: 1.8rem;\n        }\n\n        h2 {\n            margin-top: 1.6rem;\n            margin-bottom: 0.5rem;\n            font-size: 1.2rem;\n            color: #123047;\n        }\n\n        p {\n            margin: 0 0 0.8rem;\n            font-size: 0.95rem;\n        }\n\n        ol, ul {\n            padding-left: 1.4rem;\n            margin-top: 0;\n            margin-bottom: 0.8rem;\n            font-size: 0.95rem;\n        }\n\n        .reg-section {\n            background-color: #ffffff;\n            border-radius: 10px;\n            padding: 18px 18px 6px;\n            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);\n            margin-bottom: 16px;\n        }\n\n        footer.reg-footer {\n            text-align: center;\n            font-size: 0.85rem;\n            color: #555;\n            padding: 16px 0 24px;\n        }\n\n        @media (max-width: 600px) {\n            header.reg-header .reg-container {\n                flex-direction: column;\n                align-items: flex-start;\n            }\n        }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader class=\"reg-header\"\u003e\n    \u003cdiv class=\"reg-container\"\u003e\n        \u003cdiv\u003e\n            \u003cdiv class=\"reg-logo\"\u003ePo pracy na ryby\u003c/div\u003e\n            \u003cdiv\u003eRegulamin zawodów wędkarskich spinningowych\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"reg-back-link\"\u003e\n            \u003c!-- Link powrotny na stronę główną --\u003e\n            \u003ca href=\"index.html\"\u003e← Powrót na stronę główną\u003c/a\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\u003c/header\u003e\n\n\u003cmain class=\"reg-container\"\u003e\n    \u003c!-- Regulamin – treść przykładowa, możesz ją później doprecyzować prawnie --\u003e\n    \u003csection class=\"reg-section\"\u003e\n        \u003ch2\u003e§1 Postanowienia ogólne\u003c/h2\u003e\n        \u003cp\u003e1. Niniejszy regulamin określa zasady udziału w zawodach wędkarskich spinningowych „Po pracy na ryby” (dalej: „Zawody”).\u003c/p\u003e\n        \u003cp\u003e2. Organizatorem Zawodów jest [nazwa organizatora] z siedzibą w [adres], zwany dalej „Organizatorem”.\u003c/p\u003e\n        \u003cp\u003e3. Zawody odbywają się nad jeziorem w okolicach Torunia, w terminie wskazanym przez Organizatora na stronie głównej wydarzenia.\u003c/p\u003e\n        \u003cp\u003e4. Uczestnictwo w Zawodach jest równoznaczne z akceptacją niniejszego regulaminu.\u003c/p\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"reg-section\"\u003e\n        \u003ch2\u003e§2 Warunki uczestnictwa\u003c/h2\u003e\n        \u003cp\u003e1. Uczestnikiem Zawodów może zostać osoba pełnoletnia, posiadająca pełną zdolność do czynności prawnych oraz ważne uprawnienia do amatorskiego połowu ryb, jeśli są wymagane przepisami prawa.\u003c/p\u003e\n        \u003cp\u003e2. Warunkiem udziału w Zawodach jest:\u003c/p\u003e\n        \u003col\u003e\n            \u003cli\u003eprawidłowe wypełnienie formularza zgłoszeniowego na stronie internetowej,\u003c/li\u003e\n            \u003cli\u003eotrzymanie potwierdzenia przyjęcia zgłoszenia od Organizatora,\u003c/li\u003e\n            \u003cli\u003euiszczenie opłaty wpisowej w wysokości określonej na stronie wydarzenia (o ile jest ona wymagana).\u003c/li\u003e\n        \u003c/ol\u003e\n        \u003cp\u003e3. Liczba miejsc jest ograniczona. O udziale decyduje kolejność prawidłowo złożonych zgłoszeń.\u003c/p\u003e\n        \u003cp\u003e4. Organizator zastrzega sobie prawo do odmowy przyjęcia zgłoszenia bez podania przyczyny, w szczególności w przypadku wyczerpania limitu miejsc.\u003c/p\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"reg-section\"\u003e\n        \u003ch2\u003e§3 Zasady rozgrywania Zawodów\u003c/h2\u003e\n        \u003cp\u003e1. Zawody rozgrywane są metodą spinningową z brzegu, zgodnie z zasadami określonymi przez Organizatora oraz obowiązującymi przepisami prawa i regulaminem łowiska.\u003c/p\u003e\n        \u003cp\u003e2. Każdy Uczestnik korzysta z własnego sprzętu wędkarskiego, chyba że Organizator postanowi inaczej.\u003c/p\u003e\n        \u003cp\u003e3. Szczegółowe zasady punktacji (np. przeliczanie długości lub wagi ryb na punkty) zostaną przedstawione Uczestnikom przed rozpoczęciem Zawodów.\u003c/p\u003e\n        \u003cp\u003e4. Złowione ryby traktowane są z poszanowaniem zasad etyki wędkarskiej oraz zgodnie z przepisami ochrony środowiska.\u003c/p\u003e\n        \u003cp\u003e5. Naruszenie zasad fair play, regulaminu łowiska lub przepisów ochrony przyrody może skutkować wykluczeniem z Zawodów.\u003c/p\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"reg-section\"\u003e\n        \u003ch2\u003e§4 Bezpieczeństwo\u003c/h2\u003e\n        \u003cp\u003e1. Uczestnicy biorą udział w Zawodach na własną odpowiedzialność.\u003c/p\u003e\n        \u003cp\u003e2. Organizator zaleca stosowanie odzieży i obuwia dostosowanego do warunków pogodowych oraz zachowanie szczególnej ostrożności podczas poruszania się po brzegu jeziora.\u003c/p\u003e\n        \u003cp\u003e3. Uczestnicy zobowiązani są do przestrzegania zasad bezpieczeństwa oraz do stosowania się do poleceń Organizatora i osób wyznaczonych do obsługi Zawodów.\u003c/p\u003e\n        \u003cp\u003e4. Organizator nie ponosi odpowiedzialności za wypadki lub szkody powstałe z winy Uczestników lub osób trzecich.\u003c/p\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"reg-section\"\u003e\n        \u003ch2\u003e§5 Nagrody\u003c/h2\u003e\n        \u003cp\u003e1. Zwycięzcy Zawodów otrzymują nagrody rzeczowe oraz puchar, zgodnie z informacją podaną na stronie wydarzenia.\u003c/p\u003e\n        \u003cp\u003e2. Zakres i rodzaj nagród może ulec zmianie z przyczyn niezależnych od Organizatora, przy czym Organizator dołoży starań, aby wartość nagród nie była niższa niż pierwotnie zakładana.\u003c/p\u003e\n        \u003cp\u003e3. Nagrody nie podlegają wymianie na ekwiwalent pieniężny.\u003c/p\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"reg-section\"\u003e\n        \u003ch2\u003e§6 Dane osobowe\u003c/h2\u003e\n        \u003cp\u003e1. Administratorem danych osobowych Uczestników jest Organizator.\u003c/p\u003e\n        \u003cp\u003e2. Dane osobowe będą przetwarzane w celu organizacji i przeprowadzenia Zawodów, kontaktu z Uczestnikami oraz wypełnienia obowiązków prawnych ciążących na Organizatorze.\u003c/p\u003e\n        \u003cp\u003e3. Podanie danych osobowych jest dobrowolne, lecz niezbędne do udziału w Zawodach.\u003c/p\u003e\n        \u003cp\u003e4. Uczestnik ma prawo dostępu do treści swoich danych, ich poprawiania, żądania ograniczenia przetwarzania, przenoszenia danych oraz wniesienia sprzeciwu – w zakresie określonym obowiązującymi przepisami.\u003c/p\u003e\n        \u003cp\u003e5. Szczegółowe informacje dotyczące przetwarzania danych osobowych mogą zostać określone w odrębnym dokumencie – polityce prywatności.\u003c/p\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"reg-section\"\u003e\n        \u003ch2\u003e§7 Postanowienia końcowe\u003c/h2\u003e\n        \u003cp\u003e1. Organizator zastrzega sobie prawo do zmiany niniejszego regulaminu, w szczególności z przyczyn organizacyjnych, prawnych lub bezpieczeństwa. Zmiany obowiązują od chwili ich opublikowania na stronie wydarzenia.\u003c/p\u003e\n        \u003cp\u003e2. W sprawach nieuregulowanych niniejszym regulaminem zastosowanie mają odpowiednie przepisy prawa powszechnie obowiązującego.\u003c/p\u003e\n        \u003cp\u003e3. Regulamin wchodzi w życie z dniem jego opublikowania na stronie internetowej wydarzenia.\u003c/p\u003e\n    \u003c/section\u003e\n\u003c/main\u003e\n\n\u003cfooter class=\"reg-footer\"\u003e\n    © \u003cspan id=\"reg-year\"\u003e\u003c/span\u003e Po pracy na ryby. Regulamin zawodów wędkarskich spinningowych.\n\u003c/footer\u003e\n\n\u003cscript\u003e\n    // Ustawienie roku w stopce regulaminu\n    document.getElementById('reg-year').textContent = new Date().getFullYear();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n---\n\n## 3. Co zrobić na GitHubie\n\n1. Dodaj/zmień w `index.html` fragment stopki (jak wyżej).  \n2. Utwórz nowy plik `regulamin.html` z podanym kodem.  \n3. Commit + push.  \n4. Odśwież stronę GitHub Pages – kliknięcie w „Regulamin” w stopce powinno przenieść na nową stronę z treścią regulaminu.\n\nJeśli chcesz, mogę też przygotować analogiczną, osobną stronę `polityka-prywatnosci.html` i podpiąć ją pod drugi link."])</script><script>self.__next_f.push([1,"3e:T935,"])</script><script>self.__next_f.push([1,"Nie mogę samodzielnie wygenerować ani hostować obrazu, ale mogę:\n\n1. Zaproponować bardzo dokładny prompt do generatora obrazów (np. DALL·E, Midjourney, Stable Diffusion), żebyś wygenerował zdjęcie sam.  \n2. Podpowiedzieć, jak go potem wstawić na stronę.\n\n---\n\n## 1. Propozycja promptu do generatora obrazów\n\nUżyj np. w DALL·E / Midjourney / Stable Diffusion takiego promptu (po angielsku generatory działają zwykle lepiej):\n\n**Prompt:**\n\n\u003e A relaxed middle‑aged angler sitting on a small folding chair by a calm lake at sunset, holding a fishing rod, soft golden light, light mist over the water, gentle ripples, green trees in the background, casual outdoor clothing, peaceful atmosphere, high‑quality realistic photograph, 16:9 aspect ratio\n\nJeśli generator obsługuje dodatkowe parametry, możesz dodać np.:\n\n- `photorealistic, high detail, 8k`  \n- `--ar 16:9` (w Midjourney – proporcje kadru)\n\nChcesz wersję po polsku – możesz też spróbować:\n\n\u003e Zrelaksowany wędkarz w średnim wieku siedzący na składanym krzesełku nad spokojnym jeziorem o zachodzie słońca, trzyma wędkę, miękkie złote światło, lekka mgiełka nad wodą, delikatne fale, zielone drzewa w tle, swobodny strój outdoorowy, spokojna atmosfera, realistyczne zdjęcie, format poziomy 16:9\n\n---\n\n## 2. Jak wstawić wygenerowane zdjęcie na stronę\n\n1. Zapisz wygenerowany obraz np. jako `wedkarz-relaks.jpg`.\n2. W repozytorium utwórz (lub użyj istniejącego) folder `img/`.\n3. Wgraj tam plik: `img/wedkarz-relaks.jpg`.\n\n### Opcja A – użyj jako tło w sekcji HERO\n\nW `style.css` zamień:\n\n```css\n.hero {\n    ...\n    background-image: url('img/hero-wedkarze.jpg');\n    ...\n}\n```\n\nna:\n\n```css\n.hero {\n    ...\n    background-image: url('img/wedkarz-relaks.jpg');\n    background-size: cover;\n    background-position: center center;\n    background-repeat: no-repeat;\n}\n```\n\n### Opcja B – wstaw jako zdjęcie w galerii\n\nW `index.html`, w sekcji `#galeria`, możesz dodać:\n\n```html\n\u003cfigure class=\"gallery-item\"\u003e\n    \u003cimg src=\"img/wedkarz-relaks.jpg\" alt=\"Zrelaksowany wędkarz nad jeziorem o zachodzie słońca\"\u003e\n    \u003cfigcaption\u003eChwila spokoju nad wodą po całym dniu pracy.\u003c/figcaption\u003e\n\u003c/figure\u003e\n```\n\nJeśli chcesz, mogę dostosować prompt tak, by pasował dokładnie do stylu reszty strony (np. konkretny kadr, kolorystyka pod Twoje kolory)."])</script><script>self.__next_f.push([1,"3f:T1221,"])</script><script>self.__next_f.push([1,"Poniżej masz krok po kroku, dokładnie i po kolei. Wystarczy wykonać je raz; potem kolejne aktualizacje strony to tylko „wrzucanie zmian”.\n\n---\n\n## 1. Założenie repozytorium na GitHub\n\n1. Wejdź na: https://github.com  \n2. Zaloguj się lub załóż konto (Sign up), jeśli jeszcze go nie masz.\n3. Po zalogowaniu kliknij w prawym górnym rogu przycisk **“+” → New repository**.\n4. Ustaw:\n   - **Repository name** – np. `po-pracy-na-ryby`\n   - **Description** – opcjonalnie: „Landing page zawodów wędkarskich Po pracy na ryby”.\n   - **Public** – zaznacz, żeby strona była publiczna.\n   - NIE musisz zaznaczać „Initialize this repository with a README” (możemy dodać pliki później ręcznie, ale jeśli wygodniej – możesz zaznaczyć).\n5. Kliknij **Create repository**.\n\nRepo jest gotowe. Teraz trzeba dodać pliki projektu.\n\n---\n\n## 2. Wrzucenie plików (index.html, style.css, script.js, ewentualnie regulamin.html, obrazki)\n\n### Opcja A – przez przeglądarkę (najprostsze, bez gita lokalnie)\n\n1. Będąc w nowym repozytorium, kliknij **“Add file” → “Upload files”**.\n2. Przeciągnij do okna lub wybierz z dysku następujące pliki:\n   - `index.html`\n   - `style.css`\n   - `script.js`\n   - `regulamin.html` (jeśli już dodałeś)\n   - folder `img` (jeśli chcesz, możesz go dodać jako folder; w okienku uploadu po prostu zaznacz folder lub najpierw utwórz go, potem dodaj pliki wewnątrz).\n3. Na dole strony wpisz krótki opis commita, np. `Initial landing page`.\n4. Kliknij **Commit changes**.\n\nPo chwili pliki pojawią się w repozytorium.\n\n---\n\n### Opcja B – przez git lokalnie (jeśli korzystasz z terminala / GitHub Desktop)\n\nSkrótowo (jeśli Cię to nie interesuje, możesz pominąć, opcja A w zupełności wystarczy):\n\n1. W folderze z plikami projektu:\n   ```bash\n   git init\n   git add .\n   git commit -m \"Initial landing page\"\n   ```\n2. Na stronie repozytorium GitHub zobaczysz sekcję „…or push an existing repository from the command line”, skopiuj komendy typu:\n   ```bash\n   git remote add origin https://github.com/TWOJ_LOGIN/po-pracy-na-ryby.git\n   git branch -M main\n   git push -u origin main\n   ```\n\n---\n\n## 3. Włączenie GitHub Pages\n\n1. Wejdź do swojego repozytorium na GitHub.\n2. Kliknij zakładkę **Settings** (u góry).\n3. W menu po lewej znajdź **Pages** (kiedyś „Pages”, teraz bywa pod „Code and automation → Pages”).\n4. W sekcji **Build and deployment**:\n   - **Source**: wybierz `Deploy from a branch`.\n   - **Branch**: ustaw `main` (lub `master`, jeśli masz taką nazwę) i obok w polu folder wybierz `/ (root)`.\n5. Kliknij **Save**.\n\nPo kilku–kilkunastu sekundach (czasem do 1–2 minut):\n\n- Na górze strony „Pages” pojawi się informacja o adresie Twojej strony, np.:  \n  `https://twoj-login.github.io/po-pracy-na-ryby/`\n\nZapisz ten URL – to publiczny adres Twojego landing page’a.\n\n---\n\n## 4. Sprawdzenie, czy wszystko działa\n\n1. Otwórz w przeglądarce adres, który podał GitHub Pages, np.:  \n   `https://twoj-login.github.io/po-pracy-na-ryby/`\n2. Sprawdź:\n   - Czy strona się ładuje bez błędów (widzisz sekcję hero, teksty itd.).\n   - Czy CSS działa (ładne formatowanie, kolory, layout).\n   - Czy JS działa:\n     - licznik odlicza czas,\n     - menu przewija płynnie do sekcji,\n     - formularz pokazuje błędy przy pustych polach i komunikat po „wysłaniu”.\n\n3. Sprawdź konsolę przeglądarki:\n   - Otwórz narzędzia deweloperskie (F12 lub Ctrl+Shift+I).\n   - Przejdź do zakładki „Console”.\n   - Upewnij się, że nie ma czerwonych błędów typu `404 (Not Found)` – szczególnie dla:\n     - `style.css`\n     - `script.js`\n     - obrazków w `img/`\n4. Kliknij w stopce **„Regulamin”**:\n   - Powinieneś przejść na stronę `regulamin.html` z tekstem regulaminu.\n   - Kliknięcie „← Powrót na stronę główną” powinno wrócić do `index.html`.\n\n---\n\n## 5. Jak wprowadzać zmiany później\n\n1. Zmodyfikuj plik lokalnie (np. `index.html` / `style.css` / `script.js`).\n2. Jeśli używasz przeglądarki:\n   - Wejdź w repo → **Add file → Upload files** → wrzuć zaktualizowany plik (o tej samej nazwie) → **Commit changes**.\n3. Jeśli używasz gita lokalnie:\n   ```bash\n   git add .\n   git commit -m \"Opis zmiany\"\n   git push\n   ```\n4. GitHub Pages automatycznie zaktualizuje stronę (zwykle w ciągu kilkudziesięciu sekund).\n\n---\n\nJeśli podasz mi nazwę Twojego konta i repo (bez żadnych haseł!), mogę rozpisać dokładnie, jaki będzie Twój końcowy URL oraz wskazać konkretne ścieżki, jeśli coś trzeba będzie poprawić (np. błędne ścieżki do obrazów)."])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L33\",null,{\"initialState\":{\"id\":\"01a105b0-3aa0-7a6f-8adb-54dd7ad5fc39\",\"userId\":\"01a105a9-3b6e-7416-919f-b38e38ec469c\",\"title\":\"przygotuj mi prompt kt óry posłu zży do wygenerowania strony internetowej landing pagektóRA OPARTA B\",\"mode\":\"direct-battle\",\"visibility\":\"public\",\"lastMessageIds\":[\"01a10619-8120-777a-b769-c3f1467dec63\"],\"archivedAt\":null,\"deletedAt\":null,\"deletionPendingProcessing\":false,\"createdAt\":\"2026-10-04 06:53:36.291+00\",\"updatedAt\":\"2026-10-04 08:48:36.502+00\",\"messages\":[{\"id\":\"01a105b0-3b4
